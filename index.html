<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="SR Bot Office — live 3D view of Stewart Rawson's AI bots for the office TV.">
<title>SR Bot Office</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/hud.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<header id="topbar">
  <h1>SR Bot Office</h1>
  <span id="sim-pill" hidden>Simulation</span>
  <span id="live" class="live">Live</span>
  <div id="counts"></div>
  <div id="clock"></div>
  <a id="flat" href="2d/">2D</a>
  <button id="fullbtn" type="button">Fullscreen</button>
</header>
<div id="view"></div>
<aside id="roster">
  <h2>Team</h2>
  <div id="roster-list"></div>
  <h2>Activity</h2>
  <div id="activity"></div>
</aside>
<div id="bottom">
  <div id="legend">
    <span class="working">Working</span>
    <span class="collaborating">Together</span>
    <span class="idle">Idle</span>
    <span class="offline">Offline</span>
  </div>
  <div id="skybar">
    <button type="button" data-sky="now">Now</button>
    <button type="button" data-sky="day">Day</button>
    <button type="button" data-sky="evening">Evening</button>
    <button type="button" data-sky="night">Night</button>
  </div>
  <button id="simbtn" type="button">Simulate Work</button>
</div>
<footer id="credits">
  3D office adapts
  <a href="https://github.com/jefferysha0627/agent-office-3d">agent-office-3d</a>,
  <a href="https://github.com/iamlukethedev/Hermes3D">Hermes3D</a>
  and
  <a href="https://github.com/JuniorXcoder/hermes-virtual-office">hermes-virtual-office</a>
  (MIT).
</footer>
<div id="fps" hidden></div>
<noscript><p class="noscript">SR Bot Office needs JavaScript enabled. The flat view is at <a href="2d/">2d/</a>.</p></noscript>
<script type="module" src="js/office3d.js"></script>
<script>
  setTimeout(function () {
    if (!window.__office || !window.__office.booted) {
      var d = document.createElement('div');
      d.className = 'fatal';
      d.innerHTML = 'The 3D office did not start. <a href="2d/">Open the 2D view</a>.';
      document.body.appendChild(d);
    }
  }, 12000);
</script>
</body>
</html>
